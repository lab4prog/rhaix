[package]
name = "rhaix-server"
description = "HTTP layer for rhaix: file-based routing, layout wrapping and the HTMX fragment rule"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rhaix-db.workspace = true
rhaix-parser.workspace = true
rhaix-script.workspace = true
rhaix-template.workspace = true
rhai.workspace = true

anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "7"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
rhaix-template.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true, features = ["util"] }

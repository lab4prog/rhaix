[db]
driver = "sqlite"
url = ":memory:"

[app]
# Фіксований секрет: тест піднімає застосунок наново на кожен запит, і без
# цього cookie, виданий одним екземпляром, не пройшов би в наступному.
secret = "fixture-secret"

[api]
# Лише цей сайт може читати `api/` з браузера (тести CORS в api.rs).
cors = ["https://app.example.com"]
title = "Фікстура"
openapi = true

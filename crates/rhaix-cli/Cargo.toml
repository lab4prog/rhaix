[package]
name = "rhaix-cli"
description = "rhaix command line: dev server and project checks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Dev-CLI за замовчуванням уміє і Postgres: `rhaix dev`/`serve` для pg-застосунку
# працюють без пересборки. Прод-бінарник, який робить `rhaix build`, обирає
# драйвер точково за секцією [db], тож зайвого туди не потрапляє.
default = ["postgres", "mail"]
sqlite = ["rhaix-server/sqlite"]
postgres = ["rhaix-server/postgres"]
mail = ["rhaix-server/mail"]

[dependencies]
rhaix-server.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "rhaix"
path = "src/main.rs"

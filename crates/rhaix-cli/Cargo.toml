[package]
name = "rhaix-cli"
description = "The rhaix command line: new, dev, check, build and serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Dev-CLI за замовчуванням уміє і Postgres: `rhaix dev`/`serve` для pg-застосунку
# працюють без пересборки. Прод-бінарник, який робить `rhaix build`, обирає
# драйвер точково за секцією [db], тож зайвого туди не потрапляє.
default = ["postgres", "mail"]
sqlite = ["rhaix-server/sqlite"]
postgres = ["rhaix-server/postgres"]
mail = ["rhaix-server/mail"]

[dependencies]
rhaix-server.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
serde_json = "1"

[[bin]]
name = "rhaix"
path = "src/main.rs"

[dev-dependencies]
# Скелет, який видає `rhaix new`, перевіряється справжнім роутером
# rhaix-server, а не рядковим збігом: він уже є звичайною залежністю вище,
# тут лишається тільки те, чого бракує для тестів.
axum.workspace = true
tower = { workspace = true, features = ["util"] }

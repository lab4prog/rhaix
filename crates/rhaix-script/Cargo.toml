[package]
name = "rhaix-script"
description = "Rhai engine setup, value conversion and the M0 performance gate for rhaix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Справжнє надсилання пошти через SMTP. Без цього feature `mail.send(...)`
# працює в dev-режимі — друкує лист у лог замість надсилання, тож рецепт
# працює без поштового сервера. lettre тягне TLS, тому опційний.
mail = ["dep:lettre"]
# `markdown()` — CommonMark без сирого HTML (див. markdown.rs). Опційний, бо
# потрібен не кожному застосунку.
markdown = ["dep:pulldown-cmark"]

[dependencies]
rhaix-db.workspace = true
rhai.workspace = true
serde_json = "1"
tracing.workspace = true
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
ureq = "2"
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"], optional = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"], optional = true }

[[bin]]
name = "rhaix-bench"
path = "src/bin/bench.rs"

[workspace]
resolver = "2"
members = [
    "crates/rhaix-db",
    "crates/rhaix-parser",
    "crates/rhaix-script",
    "crates/rhaix-template",
    "crates/rhaix-server",
    "crates/rhaix-cli",
    "crates/rhaix-lsp",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lab4prog/rhaix"
rust-version = "1.85"

[workspace.dependencies]
rhaix-db = { path = "crates/rhaix-db" }
rhaix-parser = { path = "crates/rhaix-parser" }
rhaix-script = { path = "crates/rhaix-script" }
rhaix-template = { path = "crates/rhaix-template" }
rhaix-server = { path = "crates/rhaix-server" }
rhaix-lsp = { path = "crates/rhaix-lsp" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rhai = { version = "1", features = ["sync", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- НАЛАШТУВАННЯ ДЛЯ ДЕБЕГУ ТА РОЗРОБКИ (dev) ---
[profile.dev]
debug = 1 # Залишає базову дебаг-інформацію для вашого коду

[profile.dev.package."*"]
debug = false # Вимикає важкі debug-символи для ЗОВНІШНІХ залежностей

# --- НАЛАШТУВАННЯ ДЛЯ ФІНАЛЬНОЇ ЗБІРКИ (release) ---
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
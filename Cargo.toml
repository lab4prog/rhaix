[workspace]
resolver = "2"
members = [
    "crates/rhaix-db",
    "crates/rhaix-parser",
    "crates/rhaix-script",
    "crates/rhaix-template",
    "crates/rhaix-server",
    "crates/rhaix-cli",
    "crates/rhaix-lsp",
]

[workspace.package]
version = "1.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lab4prog/rhaix"
homepage = "https://github.com/lab4prog/rhaix"
readme = "README.en.md"
keywords = ["web", "framework", "htmx", "rhai", "ssr"]
categories = ["web-programming::http-server", "template-engine"]
# Перевірено `cargo +1.88 check --workspace --all-targets` із закоміченим
# Cargo.lock; CI тримає цю цифру чесною (job `msrv`). Раніше тут стояло 1.85,
# яке ніхто не перевіряв, — транзитивні icu_* вимагають 1.88.
rust-version = "1.88"

# `version` поруч із `path` потрібен для публікації: у crates.io шляхів немає,
# і `cargo publish` без версії відмовляється пакувати крейт. Тримати в унісон
# із `workspace.package.version` — крейти випускаються лише разом.
[workspace.dependencies]
rhaix-db = { path = "crates/rhaix-db", version = "=1.2.4" }
rhaix-parser = { path = "crates/rhaix-parser", version = "=1.2.4" }
rhaix-script = { path = "crates/rhaix-script", version = "=1.2.4" }
rhaix-template = { path = "crates/rhaix-template", version = "=1.2.4" }
rhaix-server = { path = "crates/rhaix-server", version = "=1.2.4" }
rhaix-lsp = { path = "crates/rhaix-lsp", version = "=1.2.4" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rhai = { version = "1", features = ["sync", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- НАЛАШТУВАННЯ ДЛЯ ДЕБЕГУ ТА РОЗРОБКИ (dev) ---
[profile.dev]
debug = 1 # Залишає базову дебаг-інформацію для вашого коду

[profile.dev.package."*"]
debug = false # Вимикає важкі debug-символи для ЗОВНІШНІХ залежностей

# --- НАЛАШТУВАННЯ ДЛЯ ФІНАЛЬНОЇ ЗБІРКИ (release) ---
[profile.release]
lto = "thin"
codegen-units = 1
strip = true